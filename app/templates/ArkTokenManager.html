<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <title>Ark Token Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
</head>
<body>
<div class="container" align="center">
    <h1>Ark Token 管理工具</h1>
    </br>
    
    <!-- 統一的操作區域 -->
    <form id="tokenForm">
        <div class="input-group">
            <label for="arkId">Ark ID:</label>
            <input type="text" id="arkId" name="arkId" pattern="[0-9]{8}" maxlength="8" placeholder="10000001" required>
        </div>
        <div class="input-group">
            <label for="arkToken">Ark Token:</label>
            <input type="text" id="arkToken" name="arkToken" placeholder="輸入 Token 字串或查詢結果">
        </div>
        <br>
        <div class="button-group">
            <button type="button" id="queryBtn" class="submit-btn query-btn">
                <span id="queryBtnText">查詢 Token</span>
                <span id="queryBtnSpinner" style="display: none;">⏳</span>
            </button>
            <button type="button" id="setBtn" class="submit-btn">
                <span id="setBtnText">設定 Token</span>
                <span id="setBtnSpinner" style="display: none;">⏳</span>
            </button>
        </div>
    </form>
</div>
</body>
</html>

<script>
    (() => {
        const arkIdInput = document.getElementById('arkId');
        const arkTokenInput = document.getElementById('arkToken');
        const queryBtn = document.getElementById('queryBtn');
        const setBtn = document.getElementById('setBtn');

        // 查詢 Token
        queryBtn.addEventListener('click', async function() {
            const arkId = arkIdInput.value;
            const btnText = document.getElementById('queryBtnText');
            const btnSpinner = document.getElementById('queryBtnSpinner');

            if (!/^\d{8}$/.test(arkId)) {
                Swal.fire({
                    icon: 'error',
                    title: '格式錯誤',
                    text: 'Ark ID 必須是8位數字',
                    confirmButtonColor: '#ff4444a3'
                });
                return;
            }

            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline';

            try {
                const response = await fetch('/pocSIFU/setArk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'get',
                        arkId: arkId
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.token) {
                        // 將查詢到的 Token 顯示在輸入框
                        arkTokenInput.value = data.token;
                        Swal.fire({
                            icon: 'success',
                            title: '查詢成功',
                            html: `找到 Token<br><strong>token_${arkId}</strong>`,
                            confirmButtonColor: '#40c020a3'
                        });
                    } else {
                        // 清空輸入框
                        arkTokenInput.value = '';
                        Swal.fire({
                            icon: 'info',
                            title: '查詢完成',
                            text: '此 Ark ID 尚未設定 Token',
                            confirmButtonColor: '#40c020a3'
                        });
                    }
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: '查詢失敗',
                        text: data.message || '未知錯誤',
                        confirmButtonColor: '#ff4444a3'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: '發生錯誤',
                    text: error.message,
                    confirmButtonColor: '#ff4444a3'
                });
            } finally {
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        });

        // 設定 Token
        setBtn.addEventListener('click', async function() {
            const arkId = arkIdInput.value;
            const arkToken = arkTokenInput.value;

            if (!/^\d{8}$/.test(arkId)) {
                Swal.fire({
                    icon: 'error',
                    title: '格式錯誤',
                    text: 'Ark ID 必須是8位數字',
                    confirmButtonColor: '#ff4444a3'
                });
                return;
            }

            if (!arkToken) {
                Swal.fire({
                    icon: 'error',
                    title: '欄位錯誤',
                    text: 'Ark Token 不能為空',
                    confirmButtonColor: '#ff4444a3'
                });
                return;
            }

            // 確認對話框
            const result = await Swal.fire({
                icon: 'question',
                title: '確認設定',
                html: `確定要設定以下內容嗎？<br><br>
                       <strong>Ark ID:</strong> ${arkId}<br>
                       <strong>Redis Key:</strong> token_${arkId}<br>
                       <strong>Token:</strong> ${arkToken.substring(0, 50)}${arkToken.length > 50 ? '...' : ''}`,
                showCancelButton: true,
                confirmButtonText: '確定設定',
                cancelButtonText: '取消',
                confirmButtonColor: '#40c020a3',
                cancelButtonColor: '#ff4444a3'
            });

            if (!result.isConfirmed) {
                return;
            }

            const btnText = document.getElementById('setBtnText');
            const btnSpinner = document.getElementById('setBtnSpinner');

            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline';

            try {
                const response = await fetch('/pocSIFU/setArk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'set',
                        arkId: arkId,
                        arkToken: arkToken
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '設定成功',
                        html: `成功設定<br><strong>token_${arkId}</strong>`,
                        confirmButtonColor: '#40c020a3'
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: '設定失敗',
                        text: data.message || '未知錯誤',
                        confirmButtonColor: '#ff4444a3'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: '發生錯誤',
                    text: error.message,
                    confirmButtonColor: '#ff4444a3'
                });
            } finally {
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        });

        // Matrix Rain Animation
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.id = 'MatrixRain';
        document.body.appendChild(canvas);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const sanskrit = 'ॐअआइईउऊऋॠऌॡऎएऐऒओऔअंअःकखगघङचछजझञटठडढणतथदधनपफबभमयरलळवशषसह';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const letters = (Math.random() > 0.5 ? katakana : sanskrit) + latin + nums;
        
        const fontSize = 13;
        let columns = canvas.width / fontSize;
        let drops = [];
        let lastDropsTxt = [];
        
        for (let i = 0; i < columns; i++) {
            drops[i] = dropInitIndex();
            lastDropsTxt[i] = "";
        }
        
        setInterval(draw, 30);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            if (columns > drops.length) {
                for (let i = drops.length; i < columns; i++) {
                    drops.push(dropInitIndex());
                }
            } else {
                drops.length = Math.floor(columns);
            }
        });
        
        function dropInitIndex() {
            return Math.floor(Math.random() * (canvas.height / fontSize));
        }
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            let text = '';
            let drop = null;
            for (let i = 0; i < drops.length; i++) {
                drop = drops[i];
                if (lastDropsTxt[i]) {
                    ctx.fillStyle = '#080';
                    ctx.fillText(lastDropsTxt[i], i * fontSize, (drop - 1) * fontSize);
                }
                lastDropsTxt[i] = text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillStyle = '#666';
                ctx.fillText(text, i * fontSize, drop * fontSize);
                if (drop * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                    lastDropsTxt[i] = "";
                }
                drops[i]++;
            }
        }
    })()
</script>

<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #000;
        color: #fff;
        font-family: monospace;
        font-size: 15px;
    }

    canvas {
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: block;
        position: fixed;
        z-index: -999;
        background: #000;
    }

    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 75vh;
        padding: 20px;
    }

    h1 {
        font-size: 48px;
        color: #0f0;
        margin-bottom: 10px;
        text-shadow: 0 0 10px #0f0;
    }

    .section-title {
        font-size: 24px;
        color: #0f0;
        margin: 20px 0 10px 0;
        text-align: center;
        text-shadow: 0 0 5px #0f0;
    }

    .input-group {
        display: flex;
        align-items: baseline;
        margin-bottom: 10px;
        width: 100%;
        max-width: 500px;
    }

    .input-group label {
        margin-right: 20px;
        white-space: nowrap;
        min-width: 100px;
        text-align: right;
        color: #0f0;
    }

    input[type="text"] {
        flex-grow: 1;
        background-color: #353539;
        border-radius: 5px;
        color: #0f0;
        font-size: 15px;
        font-family: monospace;
        padding: 8px 10px;
        height: 30px;
        border: 1px solid #0f0;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus {
        outline: none;
        box-shadow: 0 0 10px #0f0;
        border-color: #0f0;
    }

    input[type="text"]::placeholder {
        color: #666;
    }

    .submit-btn {
        background-color: #40c020a3;
        border: none;
        border-radius: 5px;
        color: #000;
        font-weight: bold;
        font-family: monospace;
        padding: 10px 20px;
        margin: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .submit-btn:hover {
        background-color: #40c020;
        transform: scale(1.05);
        box-shadow: 0 0 15px #40c020;
    }

    .submit-btn:active {
        transform: scale(0.98);
    }

    .query-btn {
        background-color: #2080c0a3;
    }

    .query-btn:hover {
        background-color: #2080c0;
        box-shadow: 0 0 15px #2080c0;
    }

    .result-display {
        margin-top: 30px;
        padding: 20px;
        background-color: #1a1a1a;
        border: 2px solid #0f0;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        max-width: 600px;
        width: 100%;
    }

    .result-title {
        font-size: 20px;
        color: #0f0;
        margin-bottom: 15px;
        text-align: center;
        font-weight: bold;
        text-shadow: 0 0 5px #0f0;
    }

    .result-content {
        font-size: 14px;
    }

    .result-row {
        display: flex;
        margin-bottom: 10px;
        padding: 8px;
        background-color: #222;
        border-radius: 5px;
    }

    .result-label {
        color: #0f0;
        font-weight: bold;
        min-width: 120px;
        margin-right: 10px;
    }

    .result-value {
        color: #fff;
        flex-grow: 1;
        word-break: break-all;
    }

    .token-display {
        font-family: monospace;
        color: #ffa500;
        background-color: #2a2a2a;
        padding: 5px;
        border-radius: 3px;
    }

    form {
        width: 100%;
        max-width: 500px;
    }

    .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
    }

    .button-group .submit-btn {
        flex: 1;
        max-width: 200px;
    }
</style>
