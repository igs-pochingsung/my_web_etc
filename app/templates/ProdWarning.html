<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>正式機連線風險提示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  {% include "_topbar.html" with context %}

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm border-danger">
          <div class="card-header bg-white">
            <div class="fw-semibold text-danger">正式機連線風險提示</div>
            <div class="small text-secondary">此操作可能會對正式機造成流量/效能影響，請確認後再進入。</div>
          </div>
          <div class="card-body">
            <div class="alert alert-warning mb-3">
              <div class="small mt-1">
                我們會在本機記錄你對此網站的連線資訊（例如：來源 IP、時間、頁面、參數/指令資訊、User-Agent），用於追蹤與問題排查。
              </div>
            </div>

            <form class="mt-3" method="post" action="/ProdWarning/accept" id="prodWarnForm">
              <input type="hidden" name="next" value="{{ next_url }}" />
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="1" id="agree" name="agree">
                <label class="form-check-label" for="agree">
                  我同意此網站追蹤連線資訊，並知悉此工具連結正式機可能造成影響的風險
                </label>
              </div>
              <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-danger" id="btnEnter" disabled>確定進入</button>
                <a class="btn btn-outline-secondary" href="{{ cancel_url }}">取消</a>
              </div>
              <div class="form-text small text-secondary mt-2">
                同意後僅會放行一次（短時間內導回目標頁），之後再次進入正式環境仍會再次跳出此提醒。
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const agree = document.getElementById('agree');
      const btn = document.getElementById('btnEnter');
      if (!agree || !btn) return;
      agree.addEventListener('change', function () {
        btn.disabled = !agree.checked;
      });
    })();
  </script>
</body>
</html>
