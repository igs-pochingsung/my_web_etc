<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SI FU Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
</head>
<body>
{% include "_topbar.html" with context %}
<div class="agent-skill-banner">
    <span class="agent-skill-text">🤖 現在支援 Agent Skill 囉</span>
    <button type="button" class="agent-skill-btn" onclick="showSkillDownload()">馬上下載</button>
</div>
<div class="sifulink-container" align="center" style="margin-top: 24px;">
<!-- <h1>魚機私服連結轉跳</h1> -->
    </br>
    <form class="sifulink-form" action="/generate_url" method="post" target="_blank" rel="noopener noreferrer">
        <div class="input-group">
            <label for="client_ip">Client IP:</label>
            <select name="client_ip" id="client_ip">
                {% for ip in client_ips %}
                <option value="{{ ip }}" {% if ip == selected_client_ip %}selected{% endif %}>{{ ip }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="input-group">
            <label for="client_port">Client Port:</label>
            <input type="text" id="client_port" name="client_port" value="7456">
        </div>
        <div class="input-group">
            <label for="server_ip">Server IP:</label>
            <select name="server_ip" id="server_ip">
                {% for ip in client_ips %}
                <option value="{{ ip }}" {% if ip == selected_server_ip %}selected{% endif %}>{{ ip }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="input-group">
            <label for="game">Game:</label>
            <select name="game" id="game">
                {% for game in games %}
                <option value="{{ game.value }}">{{ game.display }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="input-group">
            <label for="lang">Language:</label>
            <select name="lang" id="lang">
                {% for lang in langs %}
                <option value="{{ lang }}">{{ lang }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="input-group">
            <label for="account">Account:</label>
            <input type="text" id="account" name="account" required>
        </div>
        <br>
        <input type="submit" value="請給我網址，為了魚機用途">
    </form>
    
    <!-- 參數模式管理 -->
    <div class="pattern-manager">
        <div class="pattern-controls">
            <input type="text" id="patternName" placeholder="輸入模式名稱" maxlength="20">
            <button type="button" id="savePatternBtn" class="save-btn">💾 儲存當前參數</button>
        </div>
        <div class="pattern-list" id="patternList">
            <!-- 已儲存的參數模式會在這裡顯示 -->
        </div>
    </div>
    
    {% if url %}
    <p>Generated URL: <a href="{{ url }}">{{ url }}</a></p>
    {% endif %}
</div>
</body>
</html>

<script>
  (()=> {
      // 所有參數的記憶功能
      const fields = {
          'client_ip': document.getElementById('client_ip'),
          'client_port': document.getElementById('client_port'),
          'server_ip': document.getElementById('server_ip'),
          'game': document.getElementById('game'),
          'lang': document.getElementById('lang'),
          'account': document.getElementById('account')
      };
      
      // 頁面載入時，從localStorage讀取所有參數
      window.addEventListener('DOMContentLoaded', function() {
          Object.keys(fields).forEach(fieldName => {
              const savedValue = localStorage.getItem(`sifuLink_${fieldName}`);
              if (savedValue) {
                  const field = fields[fieldName];
                  if (field.tagName === 'SELECT') {
                      // 對於select元素，檢查是否有匹配的選項
                      const option = Array.from(field.options).find(opt => opt.value === savedValue);
                      if (option) {
                          field.value = savedValue;
                      }
                  } else {
                      field.value = savedValue;
                  }
              }
          });
      });
      
      // 為所有輸入框和選擇框添加事件監聽器
      Object.keys(fields).forEach(fieldName => {
          const field = fields[fieldName];
          
          if (field.tagName === 'SELECT') {
              // 對於select元素，監聽change事件
              field.addEventListener('change', function() {
                  localStorage.setItem(`sifuLink_${fieldName}`, this.value);
              });
          } else {
              // 對於input元素，監聽blur事件
              field.addEventListener('blur', function() {
                  if (this.value.trim()) {
                      localStorage.setItem(`sifuLink_${fieldName}`, this.value.trim());
                  }
              });
          }
      });
      
      // 當表單提交時，保存所有參數
      document.querySelector('form').addEventListener('submit', function() {
          Object.keys(fields).forEach(fieldName => {
              const field = fields[fieldName];
              const value = field.value.trim ? field.value.trim() : field.value;
              if (value) {
                  localStorage.setItem(`sifuLink_${fieldName}`, value);
              }
          });
      });

      // 參數模式管理功能
      const patternNameInput = document.getElementById('patternName');
      const savePatternBtn = document.getElementById('savePatternBtn');
      const patternList = document.getElementById('patternList');

      savePatternBtn.addEventListener('click', function() {
          const patternName = patternNameInput.value.trim();
          if (!patternName) {
              Swal.fire({
                  icon: 'error',
                  title: '錯誤',
                  text: '請輸入模式名稱！',
                  confirmButtonColor: '#40c020a3'
              });
              return;
          }

          const patterns = JSON.parse(localStorage.getItem('sifuLinkPatterns') || '[]');
          
          // 檢查是否已達到最大數量限制
          if (patterns.length >= 10) {
              Swal.fire({
                  icon: 'warning',
                  title: '警告',
                  text: '已達到最大儲存數量（10組），請先刪除一些舊的模式！',
                  confirmButtonColor: '#ff4444a3'
              });
              return;
          }

          // 檢查模式名稱是否已存在
          const existingPattern = patterns.find(p => p.name === patternName);
          if (existingPattern) {
              Swal.fire({
                  icon: 'warning',
                  title: '警告',
                  text: `模式名稱 "${patternName}" 已存在，請使用不同的名稱！`,
                  confirmButtonColor: '#ff4444a3'
              });
              return;
          }

          const currentParams = {};
          Object.keys(fields).forEach(fieldName => {
              currentParams[fieldName] = fields[fieldName].value;
          });

          patterns.push({ name: patternName, params: currentParams });
          localStorage.setItem('sifuLinkPatterns', JSON.stringify(patterns));
          localStorage.setItem('sifuLink_lastPattern', patternName);

          Swal.fire({
              icon: 'success',
              title: '成功',
              text: `模式 "${patternName}" 已儲存！`,
              confirmButtonColor: '#40c020a3'
          }).then(() => {
              patternNameInput.value = ''; // 清空輸入框
              updatePatternList();
          });
      });

      function updatePatternList() {
          const patterns = JSON.parse(localStorage.getItem('sifuLinkPatterns') || '[]');
          patternList.innerHTML = '';
          
          if (patterns.length === 0) {
              patternList.innerHTML = '<p style="color: #888; text-align: center; margin: 20px 0;">目前沒有儲存的參數模式。</p>';
              return;
          }
          
          patterns.forEach((pattern, index) => {
              const div = document.createElement('div');
              div.className = 'pattern-item';
              div.innerHTML = `
                  <span>${pattern.name}</span>
                  <button type="button" class="load-btn" data-index="${index}">🔄 載入</button>
                  <button type="button" class="delete-btn" data-index="${index}">🗑️ 刪除</button>
              `;
              patternList.appendChild(div);
          });

          // 為每個載入按鈕添加事件監聽器
          document.querySelectorAll('.pattern-item .load-btn').forEach(btn => {
              btn.addEventListener('click', function() {
                  const index = parseInt(this.getAttribute('data-index'));
                  loadPattern(index);
              });
          });

          // 為每個刪除按鈕添加事件監聽器
          document.querySelectorAll('.pattern-item .delete-btn').forEach(btn => {
              btn.addEventListener('click', function() {
                  const index = parseInt(this.getAttribute('data-index'));
                  deletePattern(index);
              });
          });
      }

      function loadPattern(index) {
          const patterns = JSON.parse(localStorage.getItem('sifuLinkPatterns') || '[]');
          if (index >= 0 && index < patterns.length) {
              const pattern = patterns[index];
              Object.keys(fields).forEach(fieldName => {
                  const field = fields[fieldName];
                  if (field.tagName === 'SELECT') {
                      const option = Array.from(field.options).find(opt => opt.value === pattern.params[fieldName]);
                      if (option) {
                          field.value = option.value;
                      }
                  } else {
                      field.value = pattern.params[fieldName];
                  }
              });
              patternNameInput.value = pattern.name;
              localStorage.setItem('sifuLink_lastPattern', pattern.name);
              Swal.fire({
                  icon: 'success',
                  title: '成功',
                  text: `模式 "${pattern.name}" 已載入！`,
                  confirmButtonColor: '#40c020a3'
              });
          } else {
              Swal.fire({
                  icon: 'error',
                  title: '錯誤',
                  text: '無效的模式索引！',
                  confirmButtonColor: '#ff4444a3'
              });
          }
      }

      function deletePattern(index) {
          const patterns = JSON.parse(localStorage.getItem('sifuLinkPatterns') || '[]');
          if (index >= 0 && index < patterns.length) {
              const patternName = patterns[index].name;
              patterns.splice(index, 1);
              localStorage.setItem('sifuLinkPatterns', JSON.stringify(patterns));
              updatePatternList();
              Swal.fire({
                  icon: 'success',
                  title: '成功',
                  text: `模式 "${patternName}" 已刪除！`,
                  confirmButtonColor: '#40c020a3'
              });
          } else {
              Swal.fire({
                  icon: 'error',
                  title: '錯誤',
                  text: '無效的模式索引！',
                  confirmButtonColor: '#ff4444a3'
              });
          }
      }

      // 防禦性：若腳本載入時DOM已可用，立即嘗試更新一次列表
      try { updatePatternList(); } catch (e) { /* ignore */ }

      // 頁面載入時顯示已儲存的模式
      window.addEventListener('DOMContentLoaded', function() {
          // 原有的參數載入邏輯
          Object.keys(fields).forEach(fieldName => {
              const savedValue = localStorage.getItem(`sifuLink_${fieldName}`);
              if (savedValue) {
                  const field = fields[fieldName];
                  if (field.tagName === 'SELECT') {
                      // 對於select元素，檢查是否有匹配的選項
                      const option = Array.from(field.options).find(opt => opt.value === savedValue);
                      if (option) {
                          field.value = savedValue;
                      }
                  } else {
                      field.value = savedValue;
                  }
              }
          });
          
          // 顯示已儲存的參數模式
          updatePatternList();

          // 若存在最後一次使用的模式名稱，則嘗試自動預填名稱（不自動套用），以利快速覆寫
          const lastPatternName = localStorage.getItem('sifuLink_lastPattern');
          if (lastPatternName) {
              patternNameInput.value = lastPatternName;
          }
      });

      // 額外確保：當頁面完全載入後再次嘗試更新列表
      window.addEventListener('load', function() {
          updatePatternList();
      });

      // Init the canvas
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.id = 'MatrixRain';
      document.body.appendChild(canvas);
      // Setting the width and height of the canvas
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      // Setting up the letters
      const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
      const sanskrit = 'ॐअआइईउऊऋॠऌॡऎएऐऒओऔअंअःकखगघङचछजझञटठडढणतथदधनपफबभमयरलळवशषसह';
      const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const nums = '0123456789';
      const letters = (Math.random() > 0.5 ? katakana : sanskrit) + latin + nums;
      // Setting up the columns
      const fontSize = 13;
      let columns = canvas.width / fontSize;
      // Setting up the drops
      let drops = [];
      let lastDropsTxt = [];
      for (let i = 0; i < columns; i++) {
          drops[i] = dropInitIndex();
          lastDropsTxt[i] = "";
      }
      // Loop the animation
      setInterval(draw, 30);
      // Resize matrix raindrops
      window.addEventListener('resize', () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          columns = canvas.width / fontSize;
          if (columns > drops.length) {
              for (let i = drops.length; i < columns; i++) {
                  drops.push(dropInitIndex());
              }
          }
          else {
              drops.length = Math.floor(columns);
          }
      });
      // Matrix raindrops init index
      function dropInitIndex() {
          return Math.floor(Math.random() * (canvas.height / fontSize));
      }
      // Setting up the draw function
      function draw() {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.font = fontSize + 'px monospace';
          let text = '';
          let drop = null;
          for (let i = 0; i < drops.length; i++) {
              drop = drops[i];
              if (lastDropsTxt[i]) {
                  ctx.fillStyle = '#080';
                  ctx.fillText(lastDropsTxt[i], i * fontSize, (drop - 1) * fontSize);
              }
              lastDropsTxt[i] = text = letters[Math.floor(Math.random() * letters.length)];
              ctx.fillStyle = '#666';
              ctx.fillText(text, i * fontSize, drop * fontSize);
              if (drop * fontSize > canvas.height && Math.random() > 0.975) {
                  drops[i] = 0;
                  lastDropsTxt[i] = "";
              }
              drops[i]++;
          }
      }
  })()

  function showSkillDownload() {
    Swal.fire({
      title: '🤖 Agent Skill 匯入說明',
      html: `
        <div style="text-align:left; font-family:monospace; font-size:13px; line-height:2;">
          <b>下載後，請依以下步驟匯入：</b><br><br>
          <span style="color:#0f0">①</span> 開啟 <b>Claude Desktop App</b><br>
          <span style="color:#0f0">②</span> 點擊左下角 <b>⚙️ Settings</b><br>
          <span style="color:#0f0">③</span> 進入 <b>Capabilities</b> 頁面<br>
          <span style="color:#0f0">④</span> 找到 <b>Skills</b> 區塊，點擊 <b>「+ Add Skill」</b><br>
          <span style="color:#0f0">⑤</span> 選擇下載的 <code>sifulink.zip</code> 檔案<br>
          <span style="color:#0f0">⑥</span> 匯入成功後，即可對 Agent 說：<br>
          &nbsp;&nbsp;&nbsp;<i style="color:#7fffb0">「幫我開 ICE 的 AladdinMirage，帳號 poc0001」</i>
          <br>
          <hr style="border-color:#333; margin:10px 0;">
          <span style="color:#aaa">💡 也可以直接在 Claude 對話中附上此 zip 檔，<br>
          &nbsp;&nbsp;&nbsp;跟 AI 說「請幫我匯入這個 skill」即可。</span>
        </div>
      `,
      icon: 'info',
      confirmButtonText: '✅ 明白了，下載 Skill',
      confirmButtonColor: '#00c864',
      showCancelButton: true,
      cancelButtonText: '取消',
      background: '#1a1a1a',
      color: '#fff',
    }).then(function(result) {
      if (result.isConfirmed) {
        window.location.href = '/download/skill';
      }
    });
  }
</script>
